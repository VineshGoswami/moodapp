name: Frontend CI/CD

on:
  push:
    branches: [ "main" ]
    paths:
      - 'frontend/**'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'frontend/**'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Check HTML Bundle Size
      run: |
        SIZE=$(stat -c%s "./frontend/index.html")
        if [ $SIZE -gt 512000 ]; then
          echo "Warning: index.html is dangerously large (${SIZE} bytes)!"
        else
          echo "index.html size is acceptable (${SIZE} bytes)."
        fi
        
    - name: Validate Fetch API Targets
      run: |
        if grep -q "http://localhost" ./frontend/app.js; then
          echo "API endpoints fallback to dynamic variables correctly."
        else
          echo "Warning: Hardcoded URLs potentially found."
        fi

    - name: Deploy to Vercel
      uses: amondnet/vercel-action@v20
      with:
        vercel-token: ${{ secrets.VERCEL_TOKEN }}
        vercel-args: '--prod'
        vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
        vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
        working-directory: ./frontend
