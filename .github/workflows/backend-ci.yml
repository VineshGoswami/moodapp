name: Backend CI/CD

on:
  push:
    branches: [ "main" ]
    paths:
      - 'backend/**'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'backend/**'

jobs:
  test:
    runs-on: ubuntu-latest
    
    services:
      mongodb:
        image: mongo:6
        ports:
          - 27017:27017
          
    defaults:
      run:
        working-directory: ./backend

    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'
        cache-dependency-path: './backend/package-lock.json'
        
    - run: npm ci
    - run: npx jest --coverage
    
    - name: Report Coverage
      run: |
        echo "## Test Coverage" >> $GITHUB_STEP_SUMMARY
        npx jest --coverage --coverageReporters=text-summary >> $GITHUB_STEP_SUMMARY

  socket-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
    - run: npm ci
    - name: Start Server and Check Health
      run: |
        npm start &
        sleep 5
        curl -f http://localhost:5000/api/health || exit 1
